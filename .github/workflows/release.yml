# A release: push a tag like v0.1.0 and this builds the exe, runs the tests, signs the exes (once
# SignPath is set up, see CODE_SIGNING.md) and makes a DRAFT pre-release on GitHub with that
# version's section of CHANGELOG.md as its text. Nothing is public until the draft is published by
# hand on GitHub (Releases → the draft → Publish).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # to create the release

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      # signing (SignPath, free for open source) runs only once this secret exists: see CODE_SIGNING.md
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Version from the tag
        id: version
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Release notes from CHANGELOG.md
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $lines = Get-Content CHANGELOG.md -Encoding utf8
          $start = [array]::FindIndex($lines, [Predicate[string]] { param($l) $l.StartsWith("## [$version]") })
          if ($start -lt 0) { throw "CHANGELOG.md has no section '## [$version]': add one before tagging." }
          $end = [array]::FindIndex($lines, $start + 1, [Predicate[string]] { param($l) $l.StartsWith("## [") })
          if ($end -lt 0) { $end = $lines.Count }
          $lines[($start + 1)..($end - 1)] | Set-Content notes.md -Encoding utf8

      - name: Test
        run: dotnet test -c Release

      - name: Build
        run: |
          $version = "${{ steps.version.outputs.version }}"
          # the plain version in the exe (not "0.2.0+commit"): SignPath checks product name and version
          dotnet publish src/AutoFantic.App -c Release -o out -p:Version=$version -p:IncludeSourceRevisionInInformationalVersion=false
          dotnet publish src/AutoFantic.Spike -c Release -o out -p:Version=$version -p:IncludeSourceRevisionInInformationalVersion=false

      # Signing: the two exes go to SignPath, come back signed and replace the unsigned ones.
      # Without the SIGNPATH_API_TOKEN secret these steps are skipped and the release is unsigned.
      - name: Upload the exes for signing
        id: unsigned
        if: env.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@v7
        with:
          name: unsigned
          path: |
            out/AutoFantic.exe
            out/autofantic-spike.exe

      - name: Sign (SignPath)
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: AutoFantic
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed
          parameters: |
            version: "${{ steps.version.outputs.version }}"

      - name: Use the signed exes
        if: env.SIGNPATH_API_TOKEN != ''
        run: |
          Copy-Item signed/AutoFantic.exe, signed/autofantic-spike.exe out/ -Force
          foreach ($exe in "out/AutoFantic.exe", "out/autofantic-spike.exe") {
            $signature = Get-AuthenticodeSignature $exe
            if ($signature.Status -ne "Valid") { throw "$exe isn't signed: $($signature.StatusMessage)" }
            "$exe signed by $($signature.SignerCertificate.Subject)"
          }

      - name: Package
        run: |
          $version = "${{ steps.version.outputs.version }}"
          Remove-Item out/*.pdb
          Copy-Item README.md, LICENSE, CHANGELOG.md out/
          Compress-Archive -Path out/* -DestinationPath "AutoFantic-$version-win-x64.zip"

      - name: Draft pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          gh release create "${{ github.ref_name }}" "AutoFantic-$version-win-x64.zip" --draft --prerelease --title "AuFantic $version" --notes-file notes.md
