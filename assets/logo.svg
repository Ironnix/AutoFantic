<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 256 256" width="256" height="256">
  <title>AuFantic</title>
  <!-- A fan with seven blades on a rounded square, from blue (cool) to green (all is well).
       src/AutoFantic.App/AuFantic.ico is this drawing at 16 to 256 pixels; the icon next to the clock
       draws the same blade (TrayIcon.cs) on a square in the state's colour. -->
  <defs>
    <linearGradient id="cool" gradientUnits="userSpaceOnUse" x1="8" y1="8" x2="248" y2="248">
      <stop offset="0" stop-color="#2a78d6" />
      <stop offset="1" stop-color="#1baf7a" />
    </linearGradient>
    <!-- a slim blade under a wide round stroke: every corner is rounded with half the stroke as its radius -->
    <path id="blade" d="M 128 97 C 128 72 156.2 58.1 183.6 61.7 A 86.5 86.5 0 0 1 197.1 75.9 C 172.2 66.9 138.5 75.8 130.2 97.1 Z" />
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#cool)" />
  <g fill="#fff" stroke="#fff" stroke-width="18" stroke-linejoin="round">
    <use xlink:href="#blade" />
    <use xlink:href="#blade" transform="rotate(51.429 128 128)" />
    <use xlink:href="#blade" transform="rotate(102.857 128 128)" />
    <use xlink:href="#blade" transform="rotate(154.286 128 128)" />
    <use xlink:href="#blade" transform="rotate(205.714 128 128)" />
    <use xlink:href="#blade" transform="rotate(257.143 128 128)" />
    <use xlink:href="#blade" transform="rotate(308.571 128 128)" />
  </g>
  <circle cx="128" cy="128" r="24" fill="#fff" />
  <circle cx="128" cy="128" r="11" fill="url(#cool)" />
</svg>
