<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 256 256" width="256" height="256">
  <title>AuFantic</title>
  <!-- A fan with three blades on a rounded square, from blue (cool) to green (all is well).
       src/AutoFantic.App/AuFantic.ico is this drawing at 16 to 256 pixels; the icon next to the clock
       and the one in the window draw the same blade (TrayIcon.cs, MainWindow.xaml) in the state's colour. -->
  <defs>
    <linearGradient id="cool" gradientUnits="userSpaceOnUse" x1="8" y1="8" x2="248" y2="248">
      <stop offset="0" stop-color="#2a78d6" />
      <stop offset="1" stop-color="#1baf7a" />
    </linearGradient>
    <path id="blade" d="M 126 102 C 116 84 108 62 110 42 A 88 88 0 0 1 202 80 C 182 86 164 98 152 116 Z" />
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#cool)" />
  <g fill="#fff" stroke="#fff" stroke-width="8" stroke-linejoin="round">
    <use xlink:href="#blade" />
    <use xlink:href="#blade" transform="rotate(120 128 128)" />
    <use xlink:href="#blade" transform="rotate(240 128 128)" />
  </g>
  <circle cx="128" cy="128" r="24" fill="#fff" />
  <circle cx="128" cy="128" r="10" fill="url(#cool)" />
</svg>
